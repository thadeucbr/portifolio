name: thadeu-portfolio

services:
  web:
    image: thadeu-portfolio:${PORTFOLIO_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thadeu-portfolio-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
    ports:
      - "${PORTFOLIO_BIND_IP:-192.168.1.239}:${PORTFOLIO_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
